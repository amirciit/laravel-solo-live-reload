name: Tests

on:
  push:
  pull_request:

jobs:
  phpunit:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.1'
            laravel: '10.*'
            testbench: '8.*'
            block_advisories: '0'
          - php: '8.2'
            laravel: '10.*'
            testbench: '8.*'
            block_advisories: '0'
          - php: '8.3'
            laravel: '10.*'
            testbench: '8.*'
            block_advisories: '0'
          - php: '8.2'
            laravel: '11.*'
            testbench: '9.*'
            block_advisories: '0'
          - php: '8.3'
            laravel: '11.*'
            testbench: '9.*'
            block_advisories: '0'
          - php: '8.2'
            laravel: '12.*'
            testbench: '10.*'
            block_advisories: '1'
          - php: '8.3'
            laravel: '12.*'
            testbench: '10.*'
            block_advisories: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Configure Laravel version
        run: |
          composer require "illuminate/console:${{ matrix.laravel }}" "illuminate/contracts:${{ matrix.laravel }}" "illuminate/routing:${{ matrix.laravel }}" "illuminate/support:${{ matrix.laravel }}" --no-interaction --no-update
          composer require "orchestra/testbench:${{ matrix.testbench }}" --dev --no-interaction --no-update

      - name: Install dependencies
        env:
          # Laravel 10 and 11 remain in the matrix for legacy compatibility
          # even when their framework releases have active advisories.
          COMPOSER_POLICY_ADVISORIES_BLOCK: ${{ matrix.block_advisories }}
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: composer test
